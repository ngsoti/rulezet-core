{% extends 'base.html' %}
{% import 'macros/admin_nav.html' as anav %}
{% block title %}Update Rule Similarities — Rulezet{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/theme-bridge.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/diff-viewer.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/dataTable.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/code-viewer.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/rule/ruleList.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/report-modal.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/rule/similarity/duplicate-table.css') }}">
{% endblock %}
{% block content %}
<div class="container my-4" id="main-container" v-cloak>
    <template v-if="fetch_all_pages">
        <div class="explorer-banner mb-4">
            <i class="fa-solid fa-link banner-watermark"></i>

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb mb-0" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em;">
                    <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted">Home</a></li>
                    <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-muted">Admin</a></li>
                    <li class="breadcrumb-item active text-muted" aria-current="page">Similarity Update</li>
                </ol>
            </nav>
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="banner-icon">
                    <i class="fa-solid fa-link"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1">Update Rule Similarities</h2>
                    <div class="banner-accent"></div>
                </div>
            </div>
            <p class="text-muted mb-0" style="max-width: 600px; font-size: 0.95rem;">
                Compute and refresh similarity scores between rules using TF-IDF and fuzzy matching.
            </p>
        </div>

        <!-- Running sessions — inline live panel, only shown when something is actually running -->
        <div v-if="running_sessions.length > 0" class="card border-0 shadow-sm rounded-3 mb-4 sim-running-card position-relative">
            <div class="premium-accent-line"></div>
            <div class="card-body p-3 p-md-4">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <span class="sim-live-dot"></span>
                    <h6 class="fw-bold mb-0">Running now</h6>
                    <span class="badge rounded-pill sim-running-count">[[ running_sessions.length ]]</span>
                </div>
                <div class="sim-running-list">
                    <div v-for="(running, index) in running_sessions" :key="'sim-' + index"
                         class="sim-running-row" @click="goto(running.uuid)">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                        <div class="sim-running-info">
                            <div class="sim-running-name">[[ running.info || 'Similarity scan' ]]</div>
                            <div class="sim-running-sub">
                                [[ formatDate(running.date_time) || running.date_time || '' ]] · [[ running.step || '—' ]]
                            </div>
                        </div>
                        <span :class="['dup-mode-badge', running.mode === 'global' ? 'dup-mode-badge--global' : 'dup-mode-badge--filter']">
                            [[ (running.mode || '').toUpperCase() ]]
                        </span>
                        <span class="sim-running-pct">[[ running.percentage || 0 ]]%</span>
                        <i class="fa-solid fa-chevron-right sim-running-arrow"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="dr-nav mb-4" id="updateTabs" role="tablist">
            <a class="dr-nav__item active" data-bs-toggle="tab" href="#global-pane" role="tab">
                <i class="fa-solid fa-globe"></i><span>Global Similarity</span>
            </a>
            <a class="dr-nav__item" data-bs-toggle="tab" href="#filtered-pane" role="tab">
                <i class="fa-solid fa-filter"></i><span>Updated Rules Similarity</span>
            </a>
            <a class="dr-nav__item" data-bs-toggle="tab" href="#history-pane" role="tab">
                <i class="fa-solid fa-clock-rotate-left"></i><span>History</span>
                <span v-if="running_sessions.length" class="dr-nav__badge" v-cloak>[[ running_sessions.length ]]</span>
            </a>
            <span class="dr-nav__sep"></span>
            {{ anav.admin_nav_toggle() }}
        </div>
        {{ anav.admin_nav_panel('similar') }}

        <div class="tab-content" id="updateTabsContent">
            <!-- Global Similarity -->
            <div class="tab-pane fade show active" id="global-pane" role="tabpanel">
                <div class="card border-0 shadow-sm p-4">
                    <div class="mb-4 d-flex align-items-center gap-2" style="border-bottom:1px solid var(--border-color); padding-bottom:.6rem;">
                        <div style="width:3px; height:14px; background:#0d6efd; border-radius:2px; flex-shrink:0;"></div>
                        <span class="fw-bold" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--subtle-text-color);">
                            <i class="fa-solid fa-globe me-1"></i>Global Similarity
                        </span>
                    </div>

                    <div class="animate__animated animate__fadeIn">
                        <duplicate-table
                            item-type="pair"
                            :items="global_duplicates"
                            :loading="loading_global"
                            default-view="table"
                            remote-search
                            :is-admin="{{ 'true' if current_user.is_admin() else 'false' }}"
                            :per-page="global_per_page"
                            @update:per-page="handleGlobalPerPageChange"
                            @search="handleGlobalSearch"
                            @refresh="fetchGlobalDuplicates(global_page)">
                            <template #filters>
                                <similar-rules-filter v-model:score="global_min_score" v-model:format="global_format"
                                    v-model:source-mode="global_source_mode" v-model:author-mode="global_author_mode"
                                    @filter="fetchGlobalDuplicates(1)">
                                </similar-rules-filter>
                            </template>
                        </duplicate-table>

                        <pagination-component v-if="global_total_pages > 1" :current-page="global_page"
                            :total-pages="global_total_pages" @change-page="(p) => fetchGlobalDuplicates(p)">
                        </pagination-component>
                    </div>
                </div>
            </div>

            <!-- Filtered Results -->
            <div class="tab-pane fade" id="filtered-pane" role="tabpanel">
                <div class="card border-0 shadow-sm p-4">
                    <div class="mb-4 d-flex align-items-center justify-content-between flex-wrap gap-2" style="border-bottom:1px solid var(--border-color); padding-bottom:.6rem;">
                        <div class="d-flex align-items-center gap-2">
                            <div style="width:3px; height:14px; background:#0d6efd; border-radius:2px; flex-shrink:0;"></div>
                            <span class="fw-bold" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--subtle-text-color);">
                                <i class="fa-solid fa-filter me-1"></i>Batch Processing Interface
                            </span>
                        </div>
                        <button type="button" class="btn btn-success btn-sm rounded-pill px-3"
                                title="Scan only rules that have never been compared before — fast, and never touches existing pairs"
                                @click="runNewOnlyScan">
                            <i class="fa-solid fa-bolt me-1"></i> Scan New Rules Only
                        </button>
                    </div>

                    <rule-list
                        mode="select"
                        default-view="table"
                        fetch-url="/rule/data_table"
                        :sync-url="false"
                        :show-filters="true"
                        :csrf-token="csrfToken"
                        :current-user-is-authenticated="true"
                        :current-user-is-admin="true"
                        @send="submitSimilarity">
                    </rule-list>

                </div>
            </div>

            <!-- History -->
            <div class="tab-pane fade" id="history-pane" role="tabpanel">
                <div class="card border-0 shadow-sm p-4">
                    <div class="mb-4 d-flex align-items-center gap-2" style="border-bottom:1px solid var(--border-color); padding-bottom:.6rem;">
                        <div style="width:3px; height:14px; background:#0d6efd; border-radius:2px; flex-shrink:0;"></div>
                        <span class="fw-bold" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:var(--subtle-text-color);">
                            <i class="fa-solid fa-clock-rotate-left me-1"></i>Update History
                        </span>
                    </div>

                    <duplicate-table
                        item-type="history"
                        :items="history_list"
                        default-view="table"
                        selectable
                        :bulk-actions="[{ key: 'delete', label: 'Delete selected', icon: 'fa-trash', variant: 'danger' }]"
                        :is-admin="{{ 'true' if current_user.is_admin() else 'false' }}"
                        :per-page="history_per_page"
                        @update:per-page="handleHistoryPerPageChange"
                        @refresh="fetchHistory(current_page)"
                        @bulk-delete="handleBulkDeleteHistory">
                    </duplicate-table>

                    <div v-if="total_pages > 1" class="mt-4">
                        <pagination-component :current-page="current_page" :total-pages="total_pages"
                            @change-page="changePage"></pagination-component>
                    </div>
                </div>
            </div>
        </div>

    </template>
    <template v-else>
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </template>
</div>
{% endblock %}

{% block script %}
<script type="module">
    const { createApp, ref, onMounted, computed, nextTick } = Vue;
    import { create_message, message_list } from '/static/js/toaster.js';
    import PaginationComponent from '/static/js/rule/paginationComponent.js';
    import DuplicateTable from '/static/js/rule/similarity/duplicateTable.js';
    import SimilarRulesFilter from '/static/js/rule/similarity/similarRulesFilter.js';
    import RuleList from '/static/js/rule/ruleList.js';
    import TagsDisplaysList from '/static/js/tags/tagsDisplaysList.js';
    import VulnerabilityDisplaysList from '/static/js/vulnerability/vulnerabilityDisplayList.js';

    const csrfToken = '{{ csrf_token() }}';

    createApp({
        delimiters: ['[[', ']]'],
        components: {
            'pagination-component': PaginationComponent,
            'duplicate-table': DuplicateTable,
            'similar-rules-filter': SimilarRulesFilter,
            'rule-list': RuleList,
            'tags-displays-list': TagsDisplaysList,
            'vulnerability-displays-list': VulnerabilityDisplaysList,
        },
        setup() {
            const fetch_all_pages = ref(false);

            async function init() {
                fetch_all_pages.value = false

                await Promise.all([
                    fetchHistory(1),
                    fetchInProgress(),
                    fetchGlobalDuplicates(1)
                ])
                await nextTick();

                fetch_all_pages.value = true
            }

            onMounted(() => {
                init()
            })





            /**
             * #################
             * # Fetch History #
             * #################
             * */
            // History

            const history_list = ref([]);
            const current_page = ref(1);
            const total_pages = ref(1);
            const history_per_page = ref(20);

            async function fetchHistory(page) {
                const res = await fetch(`/rule/history_updater/list?page=${page}&per_page=${history_per_page.value}`);
                const data = await res.json();
                if (res.status === 200) {
                    history_list.value = data.history || [];
                    total_pages.value = data.total_pages || 1;
                    current_page.value = page;
                } else {
                    history_list.value = [];
                    total_pages.value = 1;
                    current_page.value = 1;
                    create_message("Error fetching history", "danger-subtle");
                }
            }

            function handleHistoryPerPageChange(n) {
                history_per_page.value = n;
                fetchHistory(1);
            }

            // In progress

            const running_sessions = ref({});

            async function fetchInProgress() {
                const res = await fetch(`/rule/history_updater/list_in_progress`);
                const data = await res.json();
                if (res.status === 200) {
                    running_sessions.value = data.history || {};
                }
            }

            /**
             * ##################
             * # Action History #
             * ##################
             * */

            async function handleBulkDeleteHistory(uuids) {
                if (!uuids.length) return;
                if (!confirm(`Delete ${uuids.length} selected history record(s)?`)) return;
                const results = await Promise.all(uuids.map(uuid =>
                    fetch(`/rule/history_updater/delete/${uuid}`).then(res => res.ok)
                ));
                const deletedCount = results.filter(Boolean).length;
                if (deletedCount === uuids.length) {
                    create_message(`${deletedCount} history record(s) deleted`, "success-subtle");
                } else {
                    create_message(`${deletedCount}/${uuids.length} deleted — some failed`, "warning-subtle");
                }
                await fetchHistory(current_page.value);
            };

            /**
             * #################
             * # Global Update #
             * #################
             * */

            const global_duplicates = ref([]);
            const global_page = ref(1);
            const global_total_pages = ref(1);
            const loading_global = ref(false);
            const global_per_page = ref(20);

            const global_min_score = ref(0.80);
            const global_format = ref('');
            const global_source_mode = ref('all');
            const global_author_mode = ref('all');
            const global_search = ref('');

            function handleGlobalPerPageChange(n) {
                global_per_page.value = n;
                fetchGlobalDuplicates(1);
            }

            function handleGlobalSearch(term) {
                global_search.value = term;
                fetchGlobalDuplicates(1);
            }

            async function fetchGlobalDuplicates(page = 1) {
                loading_global.value = true;
                const params = new URLSearchParams({
                    page: page,
                    per_page: global_per_page.value,
                    min_score: global_min_score.value,
                    format: global_format.value,
                    source_mode: global_source_mode.value,
                    author_mode: global_author_mode.value,
                    search: global_search.value
                });
                const res = await fetch(`/rule/similar_global_duplicates?${params.toString()}`);
                if (res.ok) {
                    const data = await res.json();

                    global_duplicates.value = data.items;
                    global_page.value = data.current_page || page;
                    global_total_pages.value = data.total_pages || 1;
                }
                loading_global.value = false;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }


            /**
             * ################
             * # Utilities    #
             * ################
             * */

            const changePage = (p) => fetchHistory(p);
            const goto = (uuid) => window.location.href = `/rule/similar_loading/${uuid}`;
            const formatDate = (d) => new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const formatTime = (d) => new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

            async function _launchSimilarity(payload) {
                const res = await fetch('/rule/similar_rules/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify(payload),
                })
                const data = await res.json()
                if (res.status === 201 && data.session_uuid) {
                    window.location.href = `/rule/similar_loading/${data.session_uuid}`
                } else {
                    create_message(data.message || 'Error launching analysis', data.toast_class || 'danger-subtle')
                }
            }

            async function submitSimilarity(ids) {
                await _launchSimilarity({
                    mode: ids === 'ALL' ? 'all' : 'partial',
                    selected_ids: ids === 'ALL' ? [] : ids,
                })
            }

            async function runNewOnlyScan() {
                await _launchSimilarity({ mode: 'new_only' })
            }

            return {
                history_list, current_page, total_pages, history_per_page,
                formatDate, formatTime, fetchHistory, changePage, goto,
                handleBulkDeleteHistory, handleHistoryPerPageChange,
                message_list, fetch_all_pages, running_sessions, fetchInProgress,
                csrfToken, submitSimilarity, runNewOnlyScan,

                global_duplicates, global_page, global_total_pages, loading_global, fetchGlobalDuplicates,
                global_min_score, global_format, global_source_mode, global_author_mode,
                global_per_page, handleGlobalPerPageChange, global_search, handleGlobalSearch
            };
        }
    }).mount('#main-container');
</script>
{% endblock %}
